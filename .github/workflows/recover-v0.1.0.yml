name: recover-v0.1.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-assets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.1.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Verify the draft and its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view v0.1.0 --json isDraft --jq .isDraft)" = true
          gh release download v0.1.0 --dir release-assets
          python mcpb/check_release_assets.py release-assets
      - name: Verify the crate is already published
        run: |
          version=$(curl -fsS -A "oxiploitability-release ($GITHUB_REPOSITORY)" \
            https://crates.io/api/v1/crates/oxiploitability-mcp/0.1.0 | jq -r .version.num)
          test "$version" = 0.1.0

  publish-registry:
    needs: verify-assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.1.0
      - name: Install mcp-publisher
        run: |
          curl -fsSL --retry 3 -o mcp-publisher.tar.gz "$PUBLISHER_URL"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  finalize-release:
    needs: publish-registry
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.1.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Confirm the registry lists v0.1.0
        run: |
          url='https://registry.modelcontextprotocol.io/v0.1/servers/io.github.abelreqma%2Foxiploitability-mcp/versions/0.1.0'
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null "$url"; then
              exit 0
            fi
            sleep 15
          done
          echo 'MCP Registry does not list v0.1.0' >&2
          exit 1
      - name: Verify the release assets again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.1.0 --dir release-assets
          python mcpb/check_release_assets.py release-assets
      - name: Publish the verified GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit v0.1.0 --draft=false
          test "$(gh release view v0.1.0 --json isDraft --jq .isDraft)" = false
