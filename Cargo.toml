[package]
name = "oxiploitability-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "MCP server for sourced, evidence-aware CVE research: exploitability from NVD, EPSS and KEV, and CVEs for products, SBOMs, lockfiles and images"
license = "MIT OR Apache-2.0"
repository = "https://github.com/abelreqma/oxiploitability-mcp"
readme = "README.md"
keywords = ["mcp", "cve", "nvd", "epss", "kev"]
categories = ["command-line-utilities"]
include = ["/src/**", "/tests/**", "/README.md", "/PRIVACY.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[[bin]]
name = "oxiploitability"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
packageurl = "0.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "json", "gzip", "query"] }
rmcp = { version = "3.6.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "io-std", "signal", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }
rmcp = { version = "3.6.0", features = ["client"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
